version: '3'

services:
  rust:
    build:
      context: .
      dockerfile: ./dockerfiles/rust/Dockerfile
    container_name: rust
    volumes:
      - ./projects/rust:/project
    networks:
      - app_network
    tty: true
    stdin_open: true
    working_dir: /project
    depends_on:
      - db

  node:
    build:
      context: .
      dockerfile: ./dockerfiles/node/Dockerfile
    container_name: node
    volumes:
      - ./projects/node:/home/node/project
    ports:
      - 23000:3000
      - 25555:5555
    networks:
      - app_network
    tty: true
    stdin_open: true
    working_dir: /home/node/project/
    command: npm run dev
    depends_on:
      - db

  db:
    image: postgres:15
    hostname: db
    env_file:
      - ./.env
    networks:
      - app_network
    environment:
      - TZ=Asia/Tokyo
      - POSTGRES_DB=$DB_NAME
      - POSTGRES_USER=$DB_USER
      - POSTGRES_PASSWORD=$DB_PASS
      - PGDATA=/var/lib/postgresql/data/pgdata
    expose:
      - "5432"
    volumes:
      - func_data:/var/lib/postgresql/data

networks:
  app_network:
    driver: bridge
volumes:
  func_data: