services:
  rust:
    build:
      context: .
      dockerfile: ./dockerfiles/rust/Dockerfile
    container_name: rust
    volumes:
      - ./projects/rust:/project
    networks:
      - app_network
    tty: true
    init: true
    command: "cat"
    working_dir: /project
    depends_on:
      - db

  node:
    build:
      context: .
      dockerfile: ./dockerfiles/node/Dockerfile
    container_name: node
    volumes:
      - ./projects/node:/home/node/project
    ports:
      - 23000:3000
      - 25555:5555
    networks:
      - app_network
    tty: true
    stdin_open: true
    working_dir: /home/node/project/
    command: npm run dev
    depends_on:
      - db

  api:
    build:
      context: .
      dockerfile: ./dockerfiles/api/Dockerfile
    container_name: api
    volumes:
      - ./projects/api:/project
    ports:
      - 28080:8080
    networks:
      - app_network
    tty: true
    init: true
    command: "cat"
    working_dir: /project
    depends_on:
      - db

  db:
    image: postgres:15
    hostname: db
    container_name: db
    env_file:
      - ./.env
    networks:
      - app_network
    environment:
      - TZ=Asia/Tokyo
      - POSTGRES_DB=$DB_NAME
      - POSTGRES_USER=$DB_USER
      - POSTGRES_PASSWORD=$DB_PASS
      - PGDATA=/var/lib/postgresql/data/pgdata
    expose:
      - "5432"
    volumes:
      - func_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:8.4
    container_name: pgadmin
    ports:
      - 23068:80
    networks:
      - app_network
    volumes:
      - ./conf/servers.json:/pgadmin4/servers.json
    environment:
      PGADMIN_DEFAULT_EMAIL: user@example.com
      PGADMIN_DEFAULT_PASSWORD: password
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    depends_on:
      - db

  postfix:
    build:
      context: .
      dockerfile: ./dockerfiles/postfix/Dockerfile
    container_name: postfix
    expose:
      - "25"
    networks:
      - app_network
    volumes:
      - ./projects/postfix/main.cf:/etc/postfix/main.cf
      - ./projects/postfix/master.cf:/etc/postfix/master.cf
    environment:
      - TZ=Asia/Tokyo

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: mailhog
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
volumes:
  func_data: